name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: Tipos, lint y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      # Valores de marcador: el build solo necesita que las variables existan,
      # no que apunten a un proyecto real. Las claves de verdad viven en
      # EasyPanel y no deben pasar por GitHub Actions.
      - name: Build de la web
        run: pnpm --filter @reset-alfa/web build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_SITE_URL: https://modoguerrero.es

  docker:
    name: Build de la imagen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # El Dockerfile solo se prueba de verdad al construirlo. Sin este paso, un
      # error en la imagen no se detecta hasta el despliegue en EasyPanel, con
      # produccion delante.
      - name: Construir imagen de la web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=https://placeholder.supabase.co
            NEXT_PUBLIC_SUPABASE_ANON_KEY=placeholder-anon-key
            NEXT_PUBLIC_SITE_URL=https://modoguerrero.es
          cache-from: type=gha
          cache-to: type=gha,mode=max

  sql:
    name: Migraciones y aislamiento RLS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Aplica las migraciones y ejecuta las pruebas de RLS. Es el control mas
      # importante del repositorio: detras de esas politicas hay datos de
      # categoria especial del art. 9 RGPD.
      - name: Levantar Supabase local
        run: supabase start

      - name: Aplicar migraciones y datos de prueba
        run: supabase db reset

      - name: Pruebas de aislamiento RLS
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/rls.test.sql
