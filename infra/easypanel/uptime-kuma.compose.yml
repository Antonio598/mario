# Monitorización. Vigila que la web y n8n siguen respondiendo.
#
# Monitores a crear tras el arranque:
#
#   | Monitor      | URL                                      | Intervalo |
#   |--------------|------------------------------------------|-----------|
#   | Web          | https://modoguerrero.es/api/health       | 60 s      |
#   | n8n          | https://n8n.modoguerrero.es/healthz      | 300 s     |
#   | Certificado  | aviso a 14 días de la caducidad          | —         |
#
# Notificaciones al MISMO canal de Telegram que usa la aprobación de artículos: un solo
# sitio que mirar es un sitio que se mira.

services:
  uptime-kuma:
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    volumes:
      - uptime-kuma-data:/app/data
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  uptime-kuma-data:
